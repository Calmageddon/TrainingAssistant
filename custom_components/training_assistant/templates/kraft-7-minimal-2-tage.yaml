# Template: minimal strength training – 2×/week, 1–2 hard sets per exercise, about 30 minutes.
# Reviews show that a single set close to failure 1–3×/week already makes you clearly stronger
# (Androulakis-Korakakis et al. 2020; Nuzzo et al., Sports Medicine 2024). More volume brings a bit more.
schema_version: 1
name: Minimal Strength 2 Days
description: >-
  For little time: two short full-body workouts (~30 min), 2×/week, mostly machines and dumbbells.
  Only 1–2 sets per exercise – but each one hard, 1–2 reps short of failure. A proven minimum
  dose for strength and health.
goal: strength
defaults:
  rest_s: 120
  progression: { type: double, increment_kg: 2.5 }
exercises:
  leg_press: { name: Leg Press, aliases: [Beinpresse], equipment: machine, image: Leg_Press }
  chest_press: { name: Machine Chest Press, aliases: [Brustpresse], equipment: machine, image: Machine_Bench_Press }
  lat_pulldown: { name: Lat Pulldown, aliases: [Latziehen], equipment: cable, image: Wide-Grip_Lat_Pulldown }
  leg_curl: { name: Leg Curl, aliases: [Beinbeuger], equipment: machine, image: Lying_Leg_Curls }
  plank: { name: Plank, aliases: [Unterarmstütz], equipment: bodyweight }
  goblet_squat: { name: Goblet Squat, equipment: dumbbell }
  db_shoulder_press: { name: Dumbbell Shoulder Press, aliases: [Schulterdrücken Kurzhantel], equipment: dumbbell, image: Dumbbell_Shoulder_Press }
  cable_row: { name: Seated Cable Row, aliases: [Rudern am Kabel], equipment: cable, image: Seated_Cable_Rows }
  romanian_deadlift: { name: Romanian Deadlift, aliases: [Rumänisches Kreuzheben], equipment: barbell, image: Romanian_Deadlift }
  side_plank: { name: Side Plank, aliases: [Seitstütz], equipment: bodyweight, image: Side_Bridge }
workouts:
  - id: minimal_a
    name: Workout A
    blocks:
      - { type: warmup, note: "5 easy minutes, then one light set of the first exercise." }
      - { type: sets, exercise: leg_press, sets: 2, reps: { min: 8, max: 12 }, weight_kg: 60, note: Stop 1–2 reps before failure. }
      - { type: sets, exercise: chest_press, sets: 2, reps: { min: 8, max: 12 }, weight_kg: 30 }
      - { type: sets, exercise: lat_pulldown, sets: 2, reps: { min: 8, max: 12 }, weight_kg: 35 }
      - { type: sets, exercise: leg_curl, sets: 1, reps: { min: 10, max: 15 }, weight_kg: 25 }
      - { type: sets, exercise: plank, sets: 1, duration_s: { min: 30, max: 60 } }
      - { type: cooldown }
  - id: minimal_b
    name: Workout B
    blocks:
      - { type: warmup, note: "5 easy minutes, then one light set of the first exercise." }
      - { type: sets, exercise: goblet_squat, sets: 2, reps: { min: 8, max: 12 }, weight_kg: 16, progression: { type: double, increment_kg: 2 } }
      - { type: sets, exercise: db_shoulder_press, sets: 2, reps: { min: 8, max: 12 }, weight_kg: 10, progression: { type: double, increment_kg: 2 } }
      - { type: sets, exercise: cable_row, sets: 2, reps: { min: 8, max: 12 }, weight_kg: 35 }
      - { type: sets, exercise: romanian_deadlift, sets: 1, reps: { min: 8, max: 12 }, weight_kg: 30 }
      - { type: sets, exercise: side_plank, sets: 1, duration_s: { min: 20, max: 45 }, per_side: true }
      - { type: cooldown }
