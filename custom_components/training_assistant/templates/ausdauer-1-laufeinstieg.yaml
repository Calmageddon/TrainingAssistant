# Template: run starter – from walking to 30 minutes of running in 9 weeks, 3 runs per week.
# Run/walk intervals inspired by the NHS "Couch to 5K" plan (nhs.uk). 27 runs in order: the rotation
# always suggests the next run. Every run starts and ends with 5 minutes of brisk walking.
# Generated – one workout per run so the rotation follows the plan exactly.
schema_version: 1
name: Run Starter 9 Weeks
description: >-
  From walking to 30 minutes of running in 9 weeks: 3 runs per week with a rest day in between,
  about 30–40 minutes each. Runs on its own with a beep at every change between running and walking.
  If a run felt too hard, simply repeat it. Inspired by the NHS Couch to 5K plan.
goal: endurance
defaults:
  progression: { type: none }
exercises:
  brisk_walk: { name: Brisk Walk, aliases: [Zügiges Gehen], equipment: other, image: Walking_Treadmill, muscles: [] }
  run: { name: Easy Run, aliases: [Lockeres Laufen, Joggen], equipment: other, image: Jogging_Treadmill,
         muscles: [quads, hamstrings, calves] }
  walk: { name: Walk, aliases: [Gehen], equipment: other, image: Walking_Treadmill, muscles: [] }
