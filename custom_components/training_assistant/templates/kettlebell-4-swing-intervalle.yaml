# Template: Kettlebell swing intervals (HIIT) – short conditioning session.
# 10 rounds: 30 s swings, 30 s rest; then optionally 4 rounds 20/10 goblet squats.
# Timed – beeps/light via the "Signals" blueprint recommended.
schema_version: 1
name: Kettlebell Swing Intervals
description: >-
  Short conditioning – 10× 30 s swings / 30 s rest, then 4× 20 s goblet squats / 10 s rest.
  Timed, ideal with the "Signals" blueprint for sounds or light.
goal: endurance
exercises:
  kb_swing: { name: Two-Arm Kettlebell Swing, aliases: [Kettlebell Swing beidarmig], equipment: kettlebell, image: One-Arm_Kettlebell_Swings }
  goblet_squat: { name: Goblet Squat, equipment: kettlebell }
workouts:
  - id: hiit
    name: Swing Intervals
    blocks:
      - { type: warmup, note: "Glute bridges, light swings, goblet squat hold." }
      - { type: interval, name: Swings 30/30, rounds: 10, work_s: 30, rest_s: 30, exercises: [kb_swing], rest_after_s: 120 }
      - { type: interval, name: Goblet Squats 20/10, rounds: 4, work_s: 20, rest_s: 10, exercises: [goblet_squat] }
      - { type: cooldown }
