# Template: Full-body strength without equipment, 3×/week (A/B alternating). Only a chair/sofa needed.
# Studies show: push-ups bring similar strength and muscle gains as the bench press at the
# same effort (Kikuchi & Nakazato 2017) – what matters is training close to failure and making
# the exercises harder once they get easy.
schema_version: 1
name: Full-Body Strength, No Equipment
description: >-
  Two alternating strength workouts, 3×/week, only a chair and sofa. Reps increase from
  session to session; at the upper limit switch to the harder variation (hint on the exercise).
goal: hypertrophy
defaults:
  rest_s: 75
  progression: { type: reps }
exercises:
  squat: { name: Bodyweight Squat, aliases: [Kniebeugen], equipment: bodyweight, image: Bodyweight_Squat,
           note: "Harder – lower slowly (3 s), pause at the bottom, then split squat." }
  push_up: { name: Push-Ups, aliases: [Liegestütze], equipment: bodyweight, image: Pushups,
             note: "Levels – elevated → floor → feet elevated → archer." }
  reverse_lunge: { name: Reverse Lunge, aliases: [Ausfallschritt rückwärts], equipment: bodyweight, image: Crossover_Reverse_Lunge, unilateral: true }
  pike_push_up: { name: Pike Push-up, aliases: [Pike-Liegestütze], equipment: bodyweight, image: Handstand_Push-Ups,
                  note: "Hips high, head towards the floor – trains the shoulders." }
  single_leg_glute_bridge: { name: Single-Leg Glute Bridge, aliases: [Hüftheben einbeinig], equipment: bodyweight, unilateral: true }
  superman: { name: Superman, aliases: [Rückenstrecker liegend], equipment: bodyweight }
  plank: { name: Plank, aliases: [Unterarmstütz], equipment: bodyweight }
  bulgarian_split_squat: { name: Bulgarian Split Squat on Sofa, aliases: [Bulgarische Kniebeuge am Sofa, Bulgarian Split Squat], equipment: bodyweight, image: Split_Squat_with_Dumbbells, unilateral: true }
  decline_push_up: { name: Decline Push-up (Feet on Chair), aliases: [Liegestütze Füße auf Stuhl, Decline Push-up], equipment: bodyweight, image: Push-Ups_With_Feet_Elevated }
  step_up: { name: Step-up onto Chair, aliases: [Aufsteigen auf Stuhl], equipment: bodyweight, image: Dumbbell_Step_Ups, unilateral: true }
  chair_dip: { name: Triceps Dips on Chair, aliases: [Trizeps-Dips am Stuhl, Bench Dips], equipment: bodyweight, image: Bench_Dips }
  hip_thrust: { name: Hip Thrust on Sofa, aliases: [Hip Thrust am Sofa, Bodyweight Hip Thrust], equipment: bodyweight, image: Barbell_Hip_Thrust }
  dead_bug: { name: Dead Bug, equipment: bodyweight, unilateral: true }
  side_plank: { name: Side Plank, aliases: [Seitstütz], equipment: bodyweight, image: Side_Bridge, unilateral: true }
workouts:
  - id: a
    name: Full Body A
    blocks:
      - { type: warmup }
      - type: circuit
        name: Strength Circuit A
        rounds: 3
        rest_after_exercise_s: 30
        rest_after_round_s: 90
        exercises:
          - { exercise: squat, reps: { min: 15, max: 30 } }
          - { exercise: push_up, reps: { min: 8, max: 20 } }
          - { exercise: reverse_lunge, reps: { min: 8, max: 15 }, per_side: true }
          - { exercise: pike_push_up, reps: { min: 6, max: 12 } }
          - { exercise: single_leg_glute_bridge, reps: { min: 10, max: 20 }, per_side: true }
          - { exercise: superman, reps: { min: 10, max: 15 } }
          - { exercise: plank, duration_s: { min: 30, max: 60 } }
      - { type: cooldown }
  - id: b
    name: Full Body B
    blocks:
      - { type: warmup }
      - type: circuit
        name: Strength Circuit B
        rounds: 3
        rest_after_exercise_s: 30
        rest_after_round_s: 90
        exercises:
          - { exercise: bulgarian_split_squat, reps: { min: 8, max: 15 }, per_side: true }
          - { exercise: decline_push_up, reps: { min: 6, max: 15 } }
          - { exercise: step_up, reps: { min: 10, max: 15 }, per_side: true }
          - { exercise: chair_dip, reps: { min: 8, max: 15 } }
          - { exercise: hip_thrust, reps: { min: 12, max: 25 } }
          - { exercise: dead_bug, reps: { min: 8, max: 12 }, per_side: true }
          - { exercise: side_plank, duration_s: { min: 20, max: 45 }, per_side: true }
      - { type: cooldown }
